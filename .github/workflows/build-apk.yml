name: Build Youth Orchestra APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME}"
          BT="${SDK}/build-tools/35.0.0"
          JAR="${SDK}/platforms/android-35/android.jar"
          rm -rf build signing
          mkdir -p build/classes build/dex signing
          "${BT}/aapt2" compile --dir app/src/main/res -o build/resources.zip
          "${BT}/aapt2" link -o build/unsigned.apk -I "${JAR}" --manifest app/src/main/AndroidManifest.xml -A app/src/main/assets build/resources.zip
          javac -source 8 -target 8 -bootclasspath "${JAR}" -d build/classes app/src/main/java/org/youthorchestra/tuner/MainActivity.java
          jar cf build/classes.jar -C build/classes .
          "${BT}/d8" --release --min-api 26 --lib "${JAR}" --output build/dex build/classes.jar
          (cd build/dex && zip -q ../dex.zip classes*.dex)
          unzip -q build/dex.zip -d build/dex-unpacked
          for f in build/dex-unpacked/*.dex; do zip -q -j build/unsigned.apk "$f"; done
          "${BT}/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore signing/release.jks -storepass "$PASS" -keypass "$PASS" -alias youth-orchestra -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Youth Orchestra, OU=Music Education"
          "${BT}/apksigner" sign --ks signing/release.jks --ks-key-alias youth-orchestra --ks-pass pass:"$PASS" --key-pass pass:"$PASS" --out Youth-Orchestra-1.0.2.apk build/aligned.apk
          "${BT}/apksigner" verify --verbose Youth-Orchestra-1.0.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Youth-Orchestra-1.0.2
          path: android/Youth-Orchestra-1.0.2.apk
          if-no-files-found: error
